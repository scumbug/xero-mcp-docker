name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up node:24-alpine security patches.
    - cron: "23 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read upstream pin from Dockerfile
        id: upstream
        run: |
          ref=$(sed -n 's/^ARG UPSTREAM_REF=//p' Dockerfile)
          sha=$(sed -n 's/^ARG UPSTREAM_SHA=//p' Dockerfile)
          test -n "$ref" && test -n "$sha"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream: $ref ($sha)" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.upstream.outputs.ref }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
            type=ref,event=pr
          labels: |
            io.github.scumbug.upstream.ref=${{ steps.upstream.outputs.ref }}
            io.github.scumbug.upstream.sha=${{ steps.upstream.outputs.sha }}

      # Build amd64 into the local daemon first so it can be smoke-tested.
      - name: Build (amd64, for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: xero-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: ./scripts/smoke-test.sh xero-mcp:test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
